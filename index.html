<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&family=Press+Start+2P&display=swap"
    rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>github-profile-analyzer</title>
  
</head>

<body class=" min-h-screen font-sans antialiased bg-[url('https://images.unsplash.com/photo-1670893494919-412b65e5e58c?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D')] bg-cover bg-center bg-no-repeat">
  <nav class="w-full max-w-7xl mx-auto mt-4 px-6 py-3 grid grid-cols-[1fr_auto_1fr] items-center text-white">
    
    <!-- Left Column (Empty to balance the right side) -->
    <div></div>

    <!-- Center Column (Perfectly aligned) -->
    <h1 class="text-xl font-bold font-press text-center whitespace-nowrap">
      GitHub Profile Analyzer
    </h1>

    <!-- Right Column (Pushed to the right) -->
    <div class="flex justify-end">
      <a href="https://github.com/Tanmayyee" class="font-bold hover:text-amber-200 transition-colors">
        GitHub
      </a>
    </div>

  </nav>

  <main class="max-w-7xl mx-auto min-h-screen">
    
    <!-- search username -->
    <section class="p-4 mt-10 mb-12 max-w-xl mx-auto flex justify-center ">
    
   <form id="search-form" class="flex items-center w-full max-w-xl bg-[#f0f5fb] rounded-full shadow-[0_10px_20px_-5px_rgba(0,10,40,0.15)] border-b-4 border-[#d5e0ee] px-2 py-0 focus-within:border-b focus-within:translate-y-0.75 transition-all duration-200">
    
  
    <input type="text" id="search-input" placeholder="Enter username..."  autocomplete="off" required
      class="flex-1 bg-transparent px-5 py-2.5 text-base font-medium text-slate-700 placeholder-slate-400 focus:outline-none"/>

  
    <button  type="submit"  class="p-2 mr-1 text-[#4f46e5] hover:text-[#3730a3] transition-colors focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
    </button>

  </form>

  </section>
   
  <!-- Profile details -->
  <section class="bg-slate-400 max-w-5xl mx-auto  flex justify-center ">
          
  </section>

  </main>
  <footer></footer>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
